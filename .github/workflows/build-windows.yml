name: Build Windows

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: build-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build Windows packages
        run: npm run dist

      - name: Prepare release notes
        shell: bash
        run: |
          node scripts/release-body.mjs > release-notes.md
          echo "--- release notes preview ---"
          sed -n '1,80p' release-notes.md

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v5
        with:
          name: DragonHub-Windows
          path: |
            release/**/DragonHub-Setup-*-win-x64.exe
            release/**/DragonHub-Portable-*-win-x64.exe
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('build-{0}', github.run_number) }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && format('DragonHub {0}', github.ref_name) || format('DragonHub Build {0}', github.run_number) }}
          body_path: release-notes.md
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/') }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release/**/DragonHub-Setup-*-win-x64.exe
            release/**/DragonHub-Portable-*-win-x64.exe