name: Windows CI and Release

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/v') }}

jobs:
  build:
    name: Build Windows x64
    runs-on: windows-2025
    timeout-minutes: 60
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Read and validate version
        id: version
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "Invalid package version: $version"
          }
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$version") {
            throw "Tag $env:GITHUB_REF_NAME does not match package version v$version"
          }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Install locked dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Typecheck
        run: npm run typecheck

      - name: Build Windows installer and portable app
        run: npm run dist

      - name: Generate release notes
        shell: bash
        env:
          GITHUB_REF_TYPE: ${{ github.ref_type }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          APP_VERSION: ${{ steps.version.outputs.version }}
        run: node scripts/release-body.mjs > "release/$APP_VERSION/RELEASE-NOTES.md"

      - name: Generate CycloneDX SBOM
        shell: bash
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
        run: npm sbom --package-lock-only --sbom-format=cyclonedx --sbom-type=application > "release/$APP_VERSION/DragonHub-$APP_VERSION-sbom.cdx.json"

      - name: Generate checksums and build manifest
        env:
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: node scripts/release-manifest.mjs

      - name: Add build summary
        shell: pwsh
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
        run: |
          $directory = "release/$env:APP_VERSION"
          @"
          ## DragonHub $env:APP_VERSION — Windows x64

          | File | Size |
          |---|---:|
          $(Get-ChildItem "$directory/DragonHub-*-win-x64.exe" | ForEach-Object { "| ``$($_.Name)`` | $([math]::Round($_.Length / 1MB, 2)) MB |" } | Out-String)

          SBOM, SHA-256 checksums, build manifest, and release notes are included in the artifacts.
          "@ | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append

      - name: Upload Windows build and release metadata
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: DragonHub-Windows-${{ steps.version.outputs.version }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: release/${{ steps.version.outputs.version }}/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  attest:
    name: Attest release artifacts
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Download Windows build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: DragonHub-Windows-${{ needs.build.outputs.version }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: release/${{ needs.build.outputs.version }}

      - name: Attest installer provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release/${{ needs.build.outputs.version }}/DragonHub-*-win-x64.exe

  publish:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, attest]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download verified release files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: DragonHub-Windows-${{ needs.build.outputs.version }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: release/${{ needs.build.outputs.version }}

      - name: Publish release and assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$RELEASE_TAG" != "v$RELEASE_VERSION" ]]; then
            echo "::error::Release tag and package version do not match"
            exit 1
          fi

          asset_dir="release/$RELEASE_VERSION"
          assets=(
            "$asset_dir/DragonHub-Setup-$RELEASE_VERSION-win-x64.exe"
            "$asset_dir/DragonHub-Portable-$RELEASE_VERSION-win-x64.exe"
            "$asset_dir/DragonHub-$RELEASE_VERSION-sbom.cdx.json"
            "$asset_dir/SHA256SUMS.txt"
            "$asset_dir/release-manifest.json"
          )
          for f in "${assets[@]}"; do
            if [[ ! -s "$f" ]]; then
              echo "::error::Release asset is missing or empty: $f"
              exit 1
            fi
          done

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" \
              --title "DragonHub $RELEASE_VERSION" \
              --notes-file "$asset_dir/RELEASE-NOTES.md"
            gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
          else
            gh release create "$RELEASE_TAG" "${assets[@]}" \
              --title "DragonHub $RELEASE_VERSION" \
              --notes-file "$asset_dir/RELEASE-NOTES.md" \
              --latest
          fi

          {
            echo "## Published DragonHub $RELEASE_VERSION"
            echo
            echo "Release: https://github.com/${GITHUB_REPOSITORY}/releases/tag/${RELEASE_TAG}"
            echo
            echo "Installer provenance was attested. Verify with:"
            echo '```sh'
            echo "gh attestation verify DragonHub-Setup-${RELEASE_VERSION}-win-x64.exe --repo ${GITHUB_REPOSITORY}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  continuous:
    name: Publish continuous prerelease
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download Windows build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: DragonHub-Windows-${{ needs.build.outputs.version }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: release/${{ needs.build.outputs.version }}

      - name: Publish rolling prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          asset_dir="release/$RELEASE_VERSION"
          names=(
            "DragonHub-Setup-$RELEASE_VERSION-win-x64.exe"
            "DragonHub-Portable-$RELEASE_VERSION-win-x64.exe"
            "DragonHub-$RELEASE_VERSION-sbom.cdx.json"
            "SHA256SUMS.txt"
            "release-manifest.json"
          )
          assets=()
          for n in "${names[@]}"; do
            f="$asset_dir/$n"
            if [[ ! -s "$f" ]]; then
              echo "::error::Release asset is missing or empty: $f"
              exit 1
            fi
            assets+=("$f")
          done

          title="DragonHub Continuous Build ($RELEASE_VERSION)"
          if gh release view continuous >/dev/null 2>&1; then
            gh release edit continuous \
              --prerelease \
              --title "$title" \
              --notes-file "$asset_dir/RELEASE-NOTES.md"
            gh release upload continuous "${assets[@]}" --clobber
            # Remove stale assets from older versions so the page stays tidy.
            old_names=$(gh release view continuous --json assets --jq '.assets[].name')
            for old in $old_names; do
              keep=false
              for n in "${names[@]}"; do
                if [[ "$old" == "$n" ]]; then keep=true; break; fi
              done
              if [[ "$keep" == false ]]; then
                gh release delete-asset continuous "$old" --yes
              fi
            done
          else
            gh release create continuous "${assets[@]}" \
              --prerelease \
              --title "$title" \
              --notes-file "$asset_dir/RELEASE-NOTES.md"
          fi

          {
            echo "## Published continuous build $RELEASE_VERSION"
            echo
            echo "Release: https://github.com/${GITHUB_REPOSITORY}/releases/tag/continuous"
          } >> "$GITHUB_STEP_SUMMARY"
